name: Rip X video

on:
  push:
    branches:
      - x-video-rip-2105930486212137425

jobs:
  rip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download with yt-dlp
        shell: bash
        run: |
          set -euxo pipefail
          OUT="alervg-2105930486212137425.mp4"
          python3 -m yt_dlp -f "bv*+ba/b" --merge-output-format mp4 -o "$OUT" "https://x.com/AleRVG/status/2105930486212137425"
          test -s "$OUT"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json "$OUT" | tee metadata.json

      - name: Upload ripped video
        uses: actions/upload-artifact@v4
        with:
          name: alervg-x-video-2105930486212137425
          path: |
            alervg-2105930486212137425.mp4
            metadata.json
          if-no-files-found: error
          retention-days: 1
